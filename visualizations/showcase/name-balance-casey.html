        for (let i = 0; i < tr.customdata.length; i++) {
            const cd = tr.customdata[i];
            if (cd && cd[0] === state) {
                let sizeVal = 11;
                if (tr.marker && tr.marker.size !== undefined) {
                    if (Array.isArray(tr.marker.size)) {
                        sizeVal = tr.marker.size[i];
                    } else {
                        sizeVal = tr.marker.size;
                    }
                }

                return {
                    x: tr.x[i],
                    y: tr.y[i],
                    size: Math.max(6, sizeVal)
                };
            }
        }

        return null;
    }

    function highlightState(state) {
        if (!state) return;

        Plotly.restyle(gd, {
            locations: [[state]],
            z: [[1]]
        }, [borderTraceIndex]);

        if (centroids[state]) {
            Plotly.restyle(gd, {
                lon: [[centroids[state].lon]],
                lat: [[centroids[state].lat]],
                text: [[state]]
            }, [textTraceIndex]);
        }

        const kp = findKeyPoint(state);
        if (kp && isFinite(kp.x) && isFinite(kp.y)) {
            Plotly.restyle(gd, {
                x: [[kp.x]],
                y: [[kp.y]],
                'marker.size': [[kp.size]]
            }, [keyHighlightTraceIndex]);
        }
    }

    function clearHighlight() {
        Plotly.restyle(gd, {
            locations: [[]],
            z: [[]]
        }, [borderTraceIndex]);

        Plotly.restyle(gd, {
            lon: [[]],
            lat: [[]],
            text: [[]]
        }, [textTraceIndex]);

        Plotly.restyle(gd, {
            x: [[]],
            y: [[]],
            'marker.size': [[]]
        }, [keyHighlightTraceIndex]);
    }

    function setLineHighlightFromPeriod(period) {
        const entry = periodHighlightMap[String(period)];

        if (!entry || String(period) === "All time") {
            Plotly.restyle(gd, {
                x: [[]],
                y: [[]]
            }, [lineHighlightTraceIndex]);
        } else {
            Plotly.restyle(gd, {
                x: [[entry.start, entry.end, entry.end, entry.start]],
                y: [[0, 0, yMax * 1.08, yMax * 1.08]]
            }, [lineHighlightTraceIndex]);
        }
    }

    gd.on('plotly_hover', function(eventData) {
        if (!eventData || !eventData.points || eventData.points.length === 0) return;

        const pt = eventData.points[0];

        if (pt.curveNumber === mapTraceIndex) {
            highlightState(pt.location);
            return;
        }

        if (pt.curveNumber === keyTraceIndex) {
            if (pt.customdata && pt.customdata.length > 0) {
                highlightState(pt.customdata[0]);
            }
            return;
        }
    });

    gd.on('plotly_unhover', function(eventData) {
        clearHighlight();
    });

    gd.on('plotly_animated', function() {
        clearHighlight();

        try {
            const sliders = gd._fullLayout.sliders;
            if (sliders && sliders.length > 0) {
                const active = sliders[0].active;
                const step = sliders[0].steps[active];
                if (step && step.label !== undefined) {
                    setLineHighlightFromPeriod(step.label);
                }
            }
        } catch(e) {}
    });

    gd.on('plotly_sliderchange', function(e) {
        if (e && e.step && e.step.label !== undefined) {
            setLineHighlightFromPeriod(e.step.label);
        }
    });
})();
</script>


<script>
(function() {
  const DEFAULT_PERIOD = "Millennials";
  function applyDefaultPeriod() {
    const gd = document.querySelector(".plotly-graph-div");
    if (!gd || !gd._fullLayout || typeof Plotly === "undefined") {
      window.setTimeout(applyDefaultPeriod, 40);
      return;
    }
    Plotly.animate(
      gd,
      [DEFAULT_PERIOD],
      {
        mode: "immediate",
        frame: {duration: 0, redraw: false},
        transition: {duration: 0}
      }
    );
  }
  window.setTimeout(applyDefaultPeriod, 0);
})();
</script>
