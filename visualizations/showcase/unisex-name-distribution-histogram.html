<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100, initial-scale=1" />
  <title>Distribution of Names by Sex Balance</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1100px;
      background: #fff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .app {
      width: 1100px;
      margin: 0 auto;
    }

    .controls {
      display: grid;
      grid-template-columns:
        minmax(205px, 1fr)
        minmax(180px, 0.9fr)
        minmax(150px, 0.7fr)
        minmax(155px, 0.7fr);
      gap: 14px;
      align-items: end;
      padding: 12px 18px 9px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font: 14px Arial, Helvetica, sans-serif;
    }

    #status {
      min-height: 24px;
      padding: 5px 18px 0;
      color: #666;
      font-size: 12px;
    }

    #status.error {
      color: #a61b1b;
    }

    #plot {
      width: 1100px;
      height: 650px;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="controls">
      <div>
        <label for="generation">
          Generation
        </label>

        <select id="generation">
          <option value="all" selected>
            All time
          </option>
        </select>
      </div>

      <div>
        <label for="y_metric">
          Y-axis
        </label>

        <select id="y_metric">
          <option value="births">
            Number of births
          </option>
          <option value="names" selected>
            Number of distinct names
          </option>
        </select>
      </div>

      <div>
        <label for="bin_width">
          Bin size
        </label>

        <select id="bin_width">
          <option value="1">1%</option>
          <option value="2">2%</option>
          <option value="4" selected>4%</option>
          <option value="10">10%</option>
        </select>
      </div>

      <div>
        <label for="y_scale">
          Y-axis scale
        </label>

        <select id="y_scale">
          <option value="linear">
            Linear
          </option>
          <option value="log" selected>
            Log
          </option>
        </select>
      </div>
    </section>

    <div id="status" aria-live="polite"></div>
    <div id="plot"></div>
  </main>

  <script type="module">
    import NameData from "../../assets/js/name-data-loader.js";

    const FEMALE_COLOR = "#E4577E";
    const MIDPOINT_COLOR = "#D8C9E4";
    const MALE_COLOR = "#4C78A8";

    const BALANCE_COLORSCALE = [
      [0.00, FEMALE_COLOR],
      [0.50, MIDPOINT_COLOR],
      [1.00, MALE_COLOR]
    ];

    const PERIOD_DISPLAY_NAMES = {
      all: "All time",
      greatest_gen: "Greatest Gen",
      silent_gen: "Silent Gen",
      baby_boomers: "Baby Boomers",
      gen_x: "Gen X",
      millenials: "Millennials",
      gen_z: "Gen Z",
      gen_alpha: "Gen Alpha"
    };

    const generationSelect =
      document.getElementById(
        "generation"
      );

    const yMetricSelect =
      document.getElementById(
        "y_metric"
      );

    const binWidthSelect =
      document.getElementById(
        "bin_width"
      );

    const yScaleSelect =
      document.getElementById(
        "y_scale"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const plotEl =
      document.getElementById(
        "plot"
      );

    let records = [];
    let periodInfo = new Map();

    function setStatus(
      message,
      isError=false
    ) {
      statusEl.textContent =
        message || "";

      statusEl.classList.toggle(
        "error",
        Boolean(isError)
      );
    }

    function formatCount(value) {
      const n =
        Number(value);

      if (!Number.isFinite(n)) {
        return "";
      }

      const abs =
        Math.abs(n);

      if (abs >= 1_000_000) {
        return (
          `${(n / 1_000_000)
          .toFixed(1)
          .replace(/\.0$/, "")}M`
        );
      }

      if (abs >= 100_000) {
        return (
          `${Math.round(
            n / 1_000
          )}k`
        );
      }

      if (abs >= 1_000) {
        return (
          `${(n / 1_000)
          .toFixed(1)
          .replace(/\.0$/, "")}k`
        );
      }

      return Math.round(n)
        .toLocaleString();
    }

    function displayPeriodName(
      row
    ) {
      const key =
        String(
          row.period_key
        );

      return (
        PERIOD_DISPLAY_NAMES[key]
        || row.period
        || key
      );
    }

    function periodLabel(
      periodKey
    ) {
      const info =
        periodInfo.get(
          periodKey
        );

      if (!info) {
        return (
          PERIOD_DISPLAY_NAMES[
            periodKey
          ]
          || periodKey
        );
      }

      return (
        `${displayPeriodName(info)} `
        + `(${info.period_start}–${info.period_end})`
      );
    }

    function populateGenerationOptions() {
      const uniquePeriods =
        new Map();

      for (
        const row
        of records
      ) {
        const key =
          String(
            row.period_key
          );

        if (
          !uniquePeriods.has(key)
        ) {
          uniquePeriods.set(
            key,
            row
          );
        }
      }

      const ordered =
        [...uniquePeriods.values()]
        .sort(
          (a, b) =>
            Number(
              a.period_order
            )
            - Number(
                b.period_order
              )
        );

      periodInfo =
        new Map(
          ordered.map(
            row => [
              String(
                row.period_key
              ),
              row
            ]
          )
        );

      generationSelect.innerHTML =
        ordered
        .map(
          row => {
            const key =
              String(
                row.period_key
              );

            return (
              `<option value="${key}">`
              + `${displayPeriodName(row)} `
              + `(${row.period_start}–${row.period_end})`
              + `</option>`
            );
          }
        )
        .join("");

      generationSelect.value =
        "all";
    }

    async function configureLatestData() {
      const dataBase =
        new URL(
          "../../data/",
          window.location.href
        );

      const response =
        await fetch(
          new URL(
            "latest.json",
            dataBase
          ),
          {
            cache: "no-cache",
            headers: {
              Accept:
                "application/json"
            }
          }
        );

      if (!response.ok) {
        throw new Error(
          `Could not load data/latest.json `
          + `(HTTP ${response.status}).`
        );
      }

      const pointer =
        await response.json();

      const version =
        String(
          pointer.dataVersion ?? ""
        ).trim();

      if (!version) {
        throw new Error(
          "data/latest.json does not contain dataVersion."
        );
      }

      const dataRoot =
        new URL(
          String(
            pointer.dataRoot
            ?? `${version}/`
          ),
          dataBase
        );

      NameData.configure({
        dataRoot
      });

      const table =
        await NameData.loadGlobalTable(
          "unisexHistogramGeneration"
        );

      records =
        table?.records || [];

      populateGenerationOptions();
    }

    function topNamesHtml(
      row
    ) {
      const lines = [];

      for (
        let rank = 1;
        rank <= 5;
        rank += 1
      ) {
        const name =
          row[
            `top${rank}_name`
          ];

        const births =
          Number(
            row[
              `top${rank}_births`
            ]
          );

        if (
          !name
          || !Number.isFinite(
              births
            )
          || births <= 0
        ) {
          continue;
        }

        lines.push(
          `<b>${name}</b> - `
          + `${formatCount(births)}`
        );
      }

      return (
        lines.length
          ? lines.join("<br>")
          : "None"
      );
    }

    function currentBins() {
      const periodKey =
        generationSelect.value;

      const binWidth =
        Number(
          binWidthSelect.value
        );

      return records
        .filter(
          row =>
            String(
              row.period_key
            ) === periodKey
            && Number(
                row.bin_width
              ) === binWidth
        )
        .sort(
          (a, b) =>
            Number(
              a.bin_start
            )
            - Number(
                b.bin_start
              )
        );
    }

    function buildFigure() {
      const bins =
        currentBins();

      if (!bins.length) {
        throw new Error(
          "No histogram bins are available for this selection."
        );
      }

      const periodKey =
        generationSelect.value;

      const binWidth =
        Number(
          binWidthSelect.value
        );

      const yMetric =
        yMetricSelect.value;

      const yScale =
        yScaleSelect.value;

      const yRaw =
        bins.map(
          row =>
            yMetric === "names"
              ? Number(
                  row.distinct_names
                )
              : Number(
                  row.births
                )
        );

      const y =
        yRaw.map(
          value =>
            (
              yScale === "log"
              && value <= 0
            )
              ? null
              : value
        );

      const yLabel =
        yMetric === "names"
          ? "Distinct names"
          : "Births";

      const metricPhrase =
        yMetric === "names"
          ? "distinct names"
          : "births";

      const trace = {
        type: "bar",

        x:
          bins.map(
            row =>
              (
                Number(
                  row.bin_start
                )
                + Number(
                    row.bin_end
                  )
              )
              / 2
          ),

        y,

        width:
          bins.map(
            row =>
              (
                Number(
                  row.bin_end
                )
                - Number(
                    row.bin_start
                  )
              )
              * 0.92
          ),

        marker: {
          color:
            bins.map(
              row =>
                (
                  Number(
                    row.bin_start
                  )
                  + Number(
                      row.bin_end
                    )
                )
                / 2
            ),

          colorscale:
            BALANCE_COLORSCALE,

          cmin: 0,
          cmax: 100,
          showscale: false,

          line: {
            color:
              "rgba(0,0,0,0.16)",
            width: 0.5
          }
        },

        customdata:
          bins.map(
            row => [
              `${row.bin_start}–${row.bin_end}%`,
              Number(
                row.births
              ).toLocaleString(),
              Number(
                row.distinct_names
              ).toLocaleString(),
              topNamesHtml(row)
            ]
          ),

        hovertemplate:
          "<b>%{customdata[0]} male</b><br>"
          + "%{customdata[1]} births<br>"
          + "%{customdata[2]} distinct names"
          + "<br><br>"
          + "<b>Most popular names</b><br>"
          + "%{customdata[3]}"
          + "<extra></extra>",

        showlegend: false
      };

      const selectedPeriodLabel =
        periodLabel(
          periodKey
        );

      const layout = {
        title: {
          text:
            "<b>Distribution of Names by Sex Balance</b>"
            + "<br><sup>"
            + `${selectedPeriodLabel}; `
            + `${binWidth}-percentage-point bins; `
            + `${metricPhrase}`
            + "</sup>",
          x: 0.5,
          xanchor: "center",
          y: 0.95
        },

        width: 1100,
        height: 650,

        paper_bgcolor: "white",
        plot_bgcolor: "white",

        margin: {
          l: 96,
          r: 35,
          t: 90,
          b: 78
        },

        font: {
          size: 14
        },

        bargap: 0.04,

        xaxis: {
          title:
            "Male share of births for the name in the selected period",
          range: [
            0,
            100
          ],
          tickmode: "linear",
          dtick: 10,
          ticksuffix: "%",
          showgrid: false,
          zeroline: false
        },

        yaxis: {
          title:
            (
              yScale === "log"
                ? `${yLabel} (Log scale)`
                : yLabel
            ),
          type:
            yScale,
          tickformat:
            yScale === "linear"
              ? ",~s"
              : undefined,
          showgrid: true,
          gridcolor:
            "rgba(0,0,0,0.12)",
          zeroline: false,
          rangemode:
            yScale === "linear"
              ? "tozero"
              : undefined
        },

        annotations: [
          {
            x: 0,
            y: -0.16,
            xref: "paper",
            yref: "paper",
            xanchor: "left",
            yanchor: "top",
            showarrow: false,
            align: "left",
            font: {
              size: 11,
              color: "gray"
            },
            text:
              "Bin labels show boundaries. For example, 48–52% means [48, 52): "
              + "48% is included and 52% is not. The final bin includes 100%."
          }
        ],

        hoverlabel: {
          align: "left"
        }
      };

      return {
        data: [trace],
        layout
      };
    }

    async function render() {
      if (!records.length) {
        throw new Error(
          "The Unisex histogram summary contains no rows."
        );
      }

      const figure =
        buildFigure();

      await Plotly.react(
        plotEl,
        figure.data,
        figure.layout,
        {
          scrollZoom: false,
          displayModeBar: true,
          displaylogo: false,
          doubleClick: false,
          responsive: false,
          toImageButtonOptions: {
            format: "png",
            filename:
              "unisex_sex_balance_distribution",
            scale: 3
          }
        }
      );
    }

    for (
      const control
      of [
        generationSelect,
        yMetricSelect,
        binWidthSelect,
        yScaleSelect
      ]
    ) {
      control.addEventListener(
        "change",
        () => {
          render().catch(
            error => {
              console.error(error);

              setStatus(
                error?.message
                || String(error),
                true
              );
            }
          );
        }
      );
    }

    try {
      setStatus("Loading…");

      await configureLatestData();
      await render();

      setStatus("");

    } catch (error) {
      console.error(error);

      setStatus(
        error?.message
        || String(error),
        true
      );
    }
  </script>
</body>
</html>
