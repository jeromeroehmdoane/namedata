<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100, initial-scale=1" />
  <title>Distribution of Names by Sex Balance</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1100px;
      background: #fff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .app {
      width: 1100px;
      margin: 0 auto;
    }

    .controls {
      display: grid;
      grid-template-columns:
        minmax(180px, 0.9fr)
        minmax(180px, 0.8fr)
        minmax(180px, 0.8fr);
      gap: 14px;
      align-items: end;
      padding: 12px 18px 9px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font: 14px Arial, Helvetica, sans-serif;
    }

    #status {
      min-height: 24px;
      padding: 5px 18px 0;
      color: #666;
      font-size: 12px;
    }

    #status.error {
      color: #a61b1b;
    }

    #plot {
      width: 1100px;
      height: 650px;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="controls">
      <div>
        <label for="y_metric">
          Y-axis
        </label>

        <select id="y_metric">
          <option value="births" selected>
            Number of births
          </option>
          <option value="names">
            Number of distinct names
          </option>
        </select>
      </div>

      <div>
        <label for="bin_width">
          Bin size
        </label>

        <select id="bin_width">
          <option value="1">1%</option>
          <option value="2">2%</option>
          <option value="4" selected>4%</option>
          <option value="10">10%</option>
        </select>
      </div>

      <div>
        <label for="y_scale">
          Y-axis scale
        </label>

        <select id="y_scale">
          <option value="linear">
            Linear
          </option>
          <option value="log" selected>
            Log
          </option>
        </select>
      </div>
    </section>

    <div id="status" aria-live="polite"></div>
    <div id="plot"></div>
  </main>

  <script type="module">
    import NameData from "../../assets/js/name-data-loader.js";

    const FEMALE_COLOR = "#E4577E";
    const MALE_COLOR = "#4C78A8";
    const NEUTRAL_COLOR = "#F3F3F3";

    const BALANCE_COLORSCALE = [
      [0.00, FEMALE_COLOR],
      [0.50, NEUTRAL_COLOR],
      [1.00, MALE_COLOR]
    ];

    const yMetricSelect =
      document.getElementById(
        "y_metric"
      );

    const binWidthSelect =
      document.getElementById(
        "bin_width"
      );

    const yScaleSelect =
      document.getElementById(
        "y_scale"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const plotEl =
      document.getElementById(
        "plot"
      );

    let records = [];

    function setStatus(
      message,
      isError=false
    ) {
      statusEl.textContent =
        message || "";

      statusEl.classList.toggle(
        "error",
        Boolean(isError)
      );
    }

    async function configureLatestData() {
      const dataBase =
        new URL(
          "../../data/",
          window.location.href
        );

      const response =
        await fetch(
          new URL(
            "latest.json",
            dataBase
          ),
          {
            cache: "no-cache",
            headers: {
              Accept:
                "application/json"
            }
          }
        );

      if (!response.ok) {
        throw new Error(
          `Could not load data/latest.json `
          + `(HTTP ${response.status}).`
        );
      }

      const pointer =
        await response.json();

      const version =
        String(
          pointer.dataVersion ?? ""
        ).trim();

      if (!version) {
        throw new Error(
          "data/latest.json does not contain dataVersion."
        );
      }

      const dataRoot =
        new URL(
          String(
            pointer.dataRoot
            ?? `${version}/`
          ),
          dataBase
        );

      NameData.configure({
        dataRoot
      });

      const table =
        await NameData.loadGlobalTable(
          "unisexAllTimeSummary"
        );

      records =
        table?.records || [];
    }

    function formatCount(value) {
      const n =
        Number(value);

      if (!Number.isFinite(n)) {
        return "";
      }

      const abs =
        Math.abs(n);

      if (abs >= 1_000_000) {
        const value =
          n / 1_000_000;

        return (
          `${value.toFixed(1)
          .replace(/\.0$/, "")}M`
        );
      }

      if (abs >= 1_000) {
        const value =
          n / 1_000;

        return (
          `${value.toFixed(
            value >= 100
              ? 0
              : 1
          )
          .replace(/\.0$/, "")}k`
        );
      }

      return Math.round(n)
        .toLocaleString();
    }

    function buildBins(
      sourceRecords,
      binWidth
    ) {
      const binCount =
        Math.ceil(
          100 / binWidth
        );

      const bins =
        Array.from(
          {
            length:
              binCount
          },
          (_, index) => ({
            index,
            start:
              index * binWidth,
            endExclusive:
              Math.min(
                100,
                (
                  index + 1
                )
                * binWidth
              ),
            births: 0,
            names: 0,
            rows: []
          })
        );

      for (
        const row
        of sourceRecords
      ) {
        const malePct =
          Number(
            row.male_all_time_percentage
          );

        const allBirths =
          Number(
            row.all_time_births
          );

        if (
          !Number.isFinite(
            malePct
          )
          || !Number.isFinite(
              allBirths
            )
          || allBirths <= 0
        ) {
          continue;
        }

        const safePct =
          Math.max(
            0,
            Math.min(
              100,
              malePct
            )
          );

        const binIndex =
          safePct >= 100
            ? binCount - 1
            : Math.floor(
                safePct
                / binWidth
              );

        const bin =
          bins[
            Math.max(
              0,
              Math.min(
                binCount - 1,
                binIndex
              )
            )
          ];

        bin.births +=
          allBirths;

        bin.names += 1;

        bin.rows.push(row);
      }

      return bins.map(
        bin => {
          const topNames =
            [...bin.rows]
            .sort(
              (a, b) =>
                Number(
                  b.all_time_births
                )
                - Number(
                    a.all_time_births
                  )
                || String(a.name)
                  .localeCompare(
                    String(b.name)
                  )
            )
            .slice(
              0,
              5
            );

          const start =
            bin.start;

          const displayedEnd =
            bin.endExclusive;

          const label =
            `${start}–${displayedEnd}%`;

          const topNamesHtml =
            topNames.length
              ? topNames
                  .map(
                    row =>
                      `<b>${row.name}</b> - `
                      + `${formatCount(row.all_time_births)}`
                  )
                  .join("<br>")
              : "None";

          return {
            ...bin,
            center:
              Math.min(
                100,
                start
                + (
                    bin.endExclusive
                    - start
                  )
                  / 2
              ),
            label,
            topNamesHtml
          };
        }
      );
    }

    function buildFigure() {
      const binWidth =
        Number(
          binWidthSelect.value
        );

      const yMetric =
        yMetricSelect.value;

      const yScale =
        yScaleSelect.value;

      const bins =
        buildBins(
          records,
          binWidth
        );

      const y =
        bins.map(
          bin =>
            yMetric === "names"
              ? bin.names
              : bin.births
        );

      const yLabel =
        yMetric === "names"
          ? "Distinct names"
          : "Births";

      const metricPhrase =
        yMetric === "names"
          ? "distinct names"
          : "births";

      const trace = {
        type: "bar",

        x:
          bins.map(
            bin => bin.center
          ),

        y,

        width:
          bins.map(
            bin =>
              (
                bin.endExclusive
                - bin.start
              )
              * 0.92
          ),

        marker: {
          color:
            bins.map(
              bin => bin.center
            ),

          colorscale:
            BALANCE_COLORSCALE,

          cmin: 0,
          cmax: 100,
          showscale: false,

          line: {
            color:
              "rgba(0,0,0,0.16)",
            width: 0.5
          }
        },

        customdata:
          bins.map(
            bin => [
              bin.label,
              bin.births.toLocaleString(),
              bin.names.toLocaleString(),
              bin.topNamesHtml
            ]
          ),

        hovertemplate:
          "<b>%{customdata[0]} male</b><br>"
          + "%{customdata[1]} births<br>"
          + "%{customdata[2]} distinct names"
          + "<br><br>"
          + "<b>Most popular names</b><br>"
          + "%{customdata[3]}"
          + "<extra></extra>",

        showlegend: false
      };

      const layout = {
        title: {
          text:
            "<b>Distribution of Names by Sex Balance</b>"
            + `<br><sup>${binWidth}-percentage-point bins; `
            + `${metricPhrase}</sup>`,
          x: 0.5,
          xanchor: "center",
          y: 0.95
        },

        width: 1100,
        height: 650,

        paper_bgcolor: "white",
        plot_bgcolor: "white",

        margin: {
          l: 96,
          r: 35,
          t: 90,
          b: 78
        },

        font: {
          size: 14
        },

        bargap: 0.04,

        xaxis: {
          title:
            "Male share of all-time births for the name",
          range: [
            0,
            100
          ],
          tickmode: "linear",
          dtick: 10,
          ticksuffix: "%",
          showgrid: false,
          zeroline: false
        },

        yaxis: {
          title:
            (
              yScale === "log"
                ? `${yLabel} (Log scale)`
                : yLabel
            ),
          type:
            yScale,
          tickformat:
            yScale === "linear"
              ? ",~s"
              : undefined,
          showgrid: true,
          gridcolor:
            "rgba(0,0,0,0.12)",
          zeroline: false,
          rangemode:
            yScale === "linear"
              ? "tozero"
              : undefined
        },

        annotations: [
          {
            x: 0,
            y: -0.16,
            xref: "paper",
            yref: "paper",
            xanchor: "left",
            yanchor: "top",
            showarrow: false,
            align: "left",
            font: {
              size: 11,
              color: "gray"
            },
            text:
              "Bin labels show boundaries. For example, 48–52% means [48, 52): "
              + "48% is included and 52% is not. The final bin includes 100%."
          }
        ],

        hoverlabel: {
          align: "left"
        }
      };

      return {
        data: [trace],
        layout
      };
    }

    async function render() {
      if (!records.length) {
        throw new Error(
          "The Unisex all-time summary contains no rows."
        );
      }

      const figure =
        buildFigure();

      await Plotly.react(
        plotEl,
        figure.data,
        figure.layout,
        {
          scrollZoom: false,
          displayModeBar: true,
          displaylogo: false,
          doubleClick: false,
          responsive: false,
          toImageButtonOptions: {
            format: "png",
            filename:
              "unisex_sex_balance_distribution",
            scale: 3
          }
        }
      );
    }

    for (
      const control
      of [
        yMetricSelect,
        binWidthSelect,
        yScaleSelect
      ]
    ) {
      control.addEventListener(
        "change",
        () => {
          render().catch(
            error => {
              console.error(error);

              setStatus(
                error?.message
                || String(error),
                true
              );
            }
          );
        }
      );
    }

    try {
      setStatus("Loading…");

      await configureLatestData();
      await render();

      setStatus("");

    } catch (error) {
      console.error(error);

      setStatus(
        error?.message
        || String(error),
        true
      );
    }
  </script>
</body>
</html>
