<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100, initial-scale=1" />
  <title>Yearbook Guesser</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    :root{
      --text:#1f1f1f;
      --muted:#666;
      --border:#d8d8d8;
      --panel:#f7f7f9;
      --model:#1F77B4;
      --model-light:#eaf3fb;
      --error:#a61b1b;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:#fff;
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{min-width:1100px}

    .app{
      width:1100px;
      margin:0 auto;
      padding:12px 0 4px;
    }

    .controls{
      display:grid;
      grid-template-columns:minmax(0,1fr) 180px;
      gap:12px;
      align-items:end;
      margin:0 16px;
      padding:12px;
      border:1px solid var(--border);
      border-radius:11px;
      background:var(--panel);
    }

    .controls[hidden]{display:none}

    .preset-panel{
      margin:0 16px;
      padding:10px 14px;
      border:1px solid var(--border);
      border-radius:11px;
      background:var(--panel);
      font-size:13px;
      line-height:1.45;
    }

    .preset-panel[hidden]{display:none}

    .preset-label{font-weight:700}
    .preset-names{color:#333}

    label{
      display:block;
      margin-bottom:5px;
      font-size:12px;
      font-weight:700;
    }

    textarea,button{
      font:inherit;
    }

    textarea{
      display:block;
      width:100%;
      height:78px;
      resize:vertical;
      min-height:68px;
      max-height:150px;
      padding:9px 10px;
      border:1px solid #aaa;
      border-radius:8px;
      background:#fff;
      color:var(--text);
      line-height:1.35;
    }


    button{
      min-height:40px;
      padding:8px 14px;
      border:1px solid #8b7caf;
      border-radius:8px;
      background:#f2eff8;
      color:#30244c;
      font-weight:700;
      cursor:pointer;
    }

    button:hover{background:#e8e2f3}
    button:disabled{opacity:.55;cursor:default}

    .hint{
      margin:0 18px;
      padding:7px 2px 0;
      font-size:12px;
      color:var(--muted);
    }

    .status{
      min-height:24px;
      margin:0 18px;
      padding:5px 2px 0;
      font-size:12px;
      color:var(--muted);
    }

    .status.error{color:var(--error)}

    .prediction{
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap:12px;
      width:fit-content;
      min-width:330px;
      margin:5px auto 0;
      padding:9px 18px;
      border:2px solid var(--model);
      border-radius:12px;
      background:var(--model-light);
      color:#164f79;
    }

    .prediction[hidden]{display:none}

    .prediction-label{
      font-size:13px;
      font-weight:700;
    }

    .prediction-year{
      font-size:28px;
      line-height:1;
      font-weight:800;
      color:var(--model);
      letter-spacing:.2px;
    }

    #plot{
      width:1100px;
      height:650px;
    }
  </style>
</head>

<body>
  <main class="app">
    <section id="customControls" class="controls" aria-label="Yearbook Guesser controls" hidden>
      <div>
        <label for="namesInput">First names</label>
        <textarea
          id="namesInput"
          spellcheck="false"
          autocomplete="off"
          placeholder="e.g. Angela, Pamela, Sandra, Rita, Monica, Erica, Tina, Mary, Jessica"
        ></textarea>
      </div>

      <button id="guessButton" type="button">
        Guess Birth Year
      </button>
    </section>

    <div id="presetPanel" class="preset-panel" hidden>
      <span class="preset-label">Names:</span>
      <span id="presetNames" class="preset-names"></span>
    </div>

    <div id="customHint" class="hint" hidden>
      Separate names with commas, semicolons, or line breaks. Duplicate names are allowed and count multiple times in the model.
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <div id="prediction" class="prediction" hidden>
      <span class="prediction-label">Predicted birth year</span>
      <span id="predictionYear" class="prediction-year"></span>
    </div>

    <div id="plot"></div>
  </main>

  <script type="module">
    let NameData = null;

    const FLOOR_BIRTHS = 4;
    const MODEL_COLOR = "#1F77B4";

    // Deliberately avoids blue/cyan hues so the model prediction remains distinct.
    const NAME_COLORS = [
      "#E76F51", // coral
      "#6A4C93", // purple
      "#C44569", // magenta
      "#3A7D44", // green
      "#E9A23B", // amber
      "#8C564B", // brown
      "#BC4749", // red
      "#7A8B35", // olive
      "#D17B88", // rose
      "#A06D2F", // ochre
      "#8E5AA9", // violet
      "#CC6B5A"  // terracotta
    ];

    const PRESETS = {
      "mambo": {
        label: "Mambo No. 5",
        names: [
          "Angela","Pamela","Sandra","Rita","Monica",
          "Erica","Tina","Mary","Jessica"
        ]
      },
      "dream-team": {
        label: "USA Dream Team",
        names: [
          "Michael","Charles","Karl","Patrick","Clyde",
          "Chris","John","Scottie","David"
        ]
      },
      "friends": {
        label: "Friends Cast",
        names: [
          "Jennifer","Courteney","Lisa","Matt",
          "Matthew","David"
        ]
      },
      "custom": {
        label: "Custom names",
        names: []
      }
    };

    const customControls = document.getElementById("customControls");
    const customHint = document.getElementById("customHint");
    const presetPanel = document.getElementById("presetPanel");
    const presetNamesEl = document.getElementById("presetNames");
    const namesInput = document.getElementById("namesInput");
    const guessButton = document.getElementById("guessButton");
    const statusEl = document.getElementById("status");
    const predictionEl = document.getElementById("prediction");
    const predictionYearEl = document.getElementById("predictionYear");
    const plotEl = document.getElementById("plot");

    let manifest = null;
    let yearbookTotals = null;
    let currentResult = null;
    let loadToken = 0;

    function setStatus(message, isError=false){
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", Boolean(isError));
    }

    function cleanDisplayName(value){
      const text = String(value ?? "").trim();
      if(!text) return "";
      return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
    }

    function cleanKey(value){
      return String(value ?? "").trim().toLowerCase();
    }

    function finite(value, fallback=0){
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function parseNames(text){
      const raw = String(text ?? "").trim();
      if(!raw) return [];

      // Conveniently accept a pasted JSON/Python-style list when possible.
      if(raw.startsWith("[") && raw.endsWith("]")){
        try{
          const jsonish = raw.replace(/'/g, '"');
          const parsed = JSON.parse(jsonish);
          if(Array.isArray(parsed)){
            return parsed
              .map(value => String(value ?? "").trim())
              .filter(Boolean);
          }
        }catch(error){
          // Fall through to delimiter parsing.
        }
      }

      return raw
        .split(/[\n,;]+/)
        .map(value =>
          value
            .trim()
            .replace(/^["']+|["']+$/g, "")
            .trim()
        )
        .filter(Boolean);
    }

    function uniqueFirstSeen(names){
      const out = [];
      const seen = new Set();

      for(const name of names){
        const key = cleanKey(name);
        if(!key || seen.has(key)) continue;
        seen.add(key);
        out.push({key, input:name});
      }

      return out;
    }

    async function configureLatestData(){
      const dataBase = new URL("../../data/", window.location.href);
      const pointerUrl = new URL("latest.json", dataBase);

      const response = await fetch(pointerUrl, {
        cache:"no-cache",
        headers:{Accept:"application/json"}
      });

      if(!response.ok){
        throw new Error(
          `Could not load data/latest.json (HTTP ${response.status}).`
        );
      }

      const pointer = await response.json();
      const version = String(pointer.dataVersion ?? "").trim();

      if(!version){
        throw new Error("data/latest.json does not contain dataVersion.");
      }

      const dataRoot = new URL(
        String(pointer.dataRoot ?? `${version}/`),
        dataBase
      );

      NameData.configure({dataRoot});

      const [loadedManifest, totalsTable] = await Promise.all([
        NameData.loadManifest(),
        NameData.loadGlobalTable("yearbookYearTotals")
      ]);

      manifest = loadedManifest;

      yearbookTotals = totalsTable.records
        .map(row => ({
          year:Number(row.year),
          total:finite(row.total_recorded_births)
        }))
        .filter(row =>
          Number.isFinite(row.year) &&
          row.total > 0
        )
        .sort((a,b) => a.year - b.year);

      if(!yearbookTotals.length){
        throw new Error("The Yearbook Guesser denominator table is empty.");
      }
    }

    function smooth3YearWeighted(values){
      const n = values.length;
      const out = new Array(n);

      for(let i=0; i<n; i+=1){
        const previous = i > 0 ? values[i-1] : 0;
        const current = values[i];
        const next = i < n-1 ? values[i+1] : 0;

        out[i] =
          0.25 * previous +
          0.50 * current +
          0.25 * next;
      }

      return out;
    }

    function packetFrequencySeries(packet, years){
      const lookup = new Map(
        (packet?.yearly || []).map(row => [
          Number(row.year),
          finite(row.frequency_c)
        ])
      );

      return years.map(year => finite(lookup.get(year), 0));
    }

    function medianLikelihoodYear(years, probabilities){
      let cumulative = 0;

      for(let i=0; i<years.length; i+=1){
        cumulative += probabilities[i];
        if(cumulative >= 0.5){
          return years[i];
        }
      }

      return years[years.length-1];
    }

    async function computeYearbook(names){
      const fullNames = names.map(name => ({
        input:name,
        key:cleanKey(name)
      }));

      const unique = uniqueFirstSeen(names);

      const packets = await Promise.all(
        unique.map(item => NameData.getNationalName(item.input))
      );

      const packetByKey = new Map();
      const displayByKey = new Map();
      const missing = [];

      unique.forEach((item,index) => {
        const packet = packets[index];
        packetByKey.set(item.key, packet);

        if(packet){
          displayByKey.set(
            item.key,
            packet.displayName || cleanDisplayName(item.input)
          );
        }else{
          displayByKey.set(
            item.key,
            cleanDisplayName(item.input)
          );
          missing.push(cleanDisplayName(item.input));
        }
      });

      const years = yearbookTotals.map(row => row.year);
      const totals = yearbookTotals.map(row => row.total);

      const seriesByKey = new Map();

      unique.forEach(item => {
        const raw = packetFrequencySeries(
          packetByKey.get(item.key),
          years
        );

        const smoothed = smooth3YearWeighted(raw);
        const adjusted = smoothed.map(value =>
          Math.max(value, FLOOR_BIRTHS)
        );

        const percentage = smoothed.map((value,index) =>
          totals[index] > 0 ? value / totals[index] : 0
        );

        seriesByKey.set(item.key, {
          raw,
          smoothed,
          adjusted,
          percentage,
          displayName:displayByKey.get(item.key)
        });
      });

      const logLikelihood = years.map((year,yearIndex) => {
        let score = 0;

        for(const entry of fullNames){
          const series = seriesByKey.get(entry.key);
          const adjustedFrequency = series
            ? series.adjusted[yearIndex]
            : FLOOR_BIRTHS;

          score += Math.log(
            adjustedFrequency / totals[yearIndex]
          );
        }

        return score;
      });

      const maxLog = Math.max(...logLikelihood);

      const relative = logLikelihood.map(value =>
        Math.exp(value - maxLog)
      );

      const relativeTotal = relative.reduce(
        (sum,value) => sum + value,
        0
      );

      const modelProbability = relative.map(value =>
        relativeTotal > 0 ? value / relativeTotal : 0
      );

      const predictedYear = medianLikelihoodYear(
        years,
        modelProbability
      );

      const plotted = unique.filter(item => {
        const series = seriesByKey.get(item.key);
        return (
          series &&
          series.smoothed.reduce((sum,value) => sum + value, 0) > 0
        );
      });

      return {
        fullNames,
        unique,
        plotted,
        years,
        totals,
        seriesByKey,
        modelProbability,
        predictedYear,
        missing
      };
    }

    function predictionAnnotation(predictedYear){
      return {
        x:predictedYear,
        y:0.028,
        xref:"x",
        yref:"paper",
        text:`<b>${predictedYear}</b>`,
        showarrow:false,
        xanchor:"center",
        yanchor:"top",
        font:{size:15,color:MODEL_COLOR},
        bgcolor:"rgba(255,255,255,0.78)"
      };
    }

    function peakLabelAnnotations(result, valueKey){
      const yearMin = result.years[0];
      const yearMax = result.years[result.years.length-1];
      const midpoint = (yearMin + yearMax) / 2;

      let globalMax = 0;
      for(const item of result.plotted){
        const values = result.seriesByKey.get(item.key)[valueKey];
        for(const value of values){
          if(Number.isFinite(value)){
            globalMax = Math.max(globalMax, value);
          }
        }
      }

      const points = [];

      result.plotted.forEach((item,index) => {
        const series = result.seriesByKey.get(item.key);
        const values = series[valueKey];
        const color = NAME_COLORS[index % NAME_COLORS.length];

        let peakIndex = -1;
        let peakValue = -Infinity;

        values.forEach((value,i) => {
          if(Number.isFinite(value) && value > peakValue){
            peakValue = value;
            peakIndex = i;
          }
        });

        if(peakIndex < 0 || !(peakValue > 0)) return;

        const peakYear = result.years[peakIndex];
        let direction = peakYear < 1920 ? 1 : -1;

        // If the peak is close to the prediction, put the label on the
        // side of the peak that moves it away from the prediction line.
        if(Math.abs(peakYear - result.predictedYear) <= 6){
          if(peakYear < result.predictedYear){
            direction = -1;
          }else if(peakYear > result.predictedYear){
            direction = 1;
          }else{
            direction = result.predictedYear < midpoint ? 1 : -1;
          }
        }

        let x = peakYear + direction;

        if(Math.abs(x - result.predictedYear) < 4){
          x = result.predictedYear + 4 * direction;
        }

        x = Math.max(yearMin + 1, Math.min(yearMax - 1, x));

        points.push({
          displayName:series.displayName,
          color,
          peakYear,
          peakValue,
          yNorm:globalMax > 0 ? peakValue / globalMax : 0,
          x,
          direction,
          xanchor:direction > 0 ? "left" : "right",
          xshift:6 * direction,
          yshift:0
        });
      });

      // Greedy collision adjustment. Labels stay at their peak height, but
      // receive small pixel shifts when two peaks occupy nearly the same
      // visual region. This keeps labels readable without disconnecting them
      // from the corresponding curves.
      const placed = [];
      const yshiftPattern = [0, 14, -14, 28, -28, 42, -42];

      points
        .sort((a,b) => a.x - b.x || b.peakValue - a.peakValue)
        .forEach(point => {
          let collisionCount = 0;

          for(const other of placed){
            if(
              Math.abs(point.x - other.x) <= 8 &&
              Math.abs(point.yNorm - other.yNorm) <= 0.12
            ){
              collisionCount += 1;
            }
          }

          point.yshift = yshiftPattern[
            Math.min(collisionCount, yshiftPattern.length - 1)
          ];

          if(collisionCount > 0){
            point.xshift += 5 * point.direction * collisionCount;
          }

          placed.push(point);
        });

      return points.map(point => ({
        x:point.x,
        y:point.peakValue,
        xref:"x",
        yref:"y",
        text:`<b>${point.displayName}</b>`,
        showarrow:false,
        xanchor:point.xanchor,
        yanchor:"middle",
        xshift:point.xshift,
        yshift:point.yshift,
        font:{size:13,color:point.color}
      }));
    }

    async function renderPlot(result){
      const traces = [];
      const freqTraceIndices = [];
      const pctTraceIndices = [];
      const alwaysVisibleIndices = [];

      result.plotted.forEach((item,index) => {
        const series = result.seriesByKey.get(item.key);
        const color = NAME_COLORS[index % NAME_COLORS.length];

        traces.push({
          type:"scatter",
          x:result.years,
          y:series.smoothed,
          mode:"lines",
          line:{color,width:1.8},
          opacity:0.42,
          name:series.displayName,
          showlegend:false,
          visible:true,
          hoverinfo:"skip"
        });
        freqTraceIndices.push(traces.length - 1);

        traces.push({
          type:"scatter",
          x:result.years,
          y:series.percentage,
          mode:"lines",
          line:{color,width:1.8},
          opacity:0.42,
          name:series.displayName,
          showlegend:false,
          visible:false,
          hoverinfo:"skip"
        });
        pctTraceIndices.push(traces.length - 1);
      });

      traces.push({
        type:"scatter",
        x:result.years,
        y:result.modelProbability,
        mode:"lines",
        line:{color:MODEL_COLOR,width:4},
        name:"Model probability",
        yaxis:"y2",
        showlegend:false,
        visible:true,
        hoverinfo:"skip"
      });
      alwaysVisibleIndices.push(traces.length - 1);

      const nTraces = traces.length;
      const visibleFrequency = new Array(nTraces).fill(false);
      const visiblePercentage = new Array(nTraces).fill(false);

      for(const idx of freqTraceIndices.concat(alwaysVisibleIndices)){
        visibleFrequency[idx] = true;
      }

      for(const idx of pctTraceIndices.concat(alwaysVisibleIndices)){
        visiblePercentage[idx] = true;
      }

      const prediction = predictionAnnotation(result.predictedYear);
      const frequencyAnnotations = [
        ...peakLabelAnnotations(result,"smoothed"),
        prediction
      ];
      const percentageAnnotations = [
        ...peakLabelAnnotations(result,"percentage"),
        prediction
      ];

      const yearMin = result.years[0];
      const yearMax = result.years[result.years.length-1];

      const layout = {
        width:1100,
        height:650,
        paper_bgcolor:"white",
        plot_bgcolor:"white",
        hovermode:false,
        showlegend:false,
        margin:{l:75,r:85,t:105,b:75},
        font:{size:14},

        title:{
          text:
            `<b>Yearbook Guesser</b><br>` +
            `<sup>${result.fullNames.length} names, median likelihood estimate</sup>`,
          x:0.5,
          xanchor:"center",
          y:0.93
        },

        xaxis:{
          title:{text:"Birth year"},
          range:[yearMin,yearMax],
          showgrid:true,
          gridcolor:"rgba(0,0,0,0.10)",
          zeroline:false,
          fixedrange:false
        },

        yaxis:{
          title:{text:"Smoothed frequency"},
          showgrid:true,
          gridcolor:"rgba(0,0,0,0.10)",
          zeroline:false,
          tickformat:",",
          rangemode:"tozero",
          fixedrange:false
        },

        yaxis2:{
          title:{
            text:"Model probability",
            font:{color:MODEL_COLOR}
          },
          tickfont:{color:MODEL_COLOR},
          overlaying:"y",
          side:"right",
          showgrid:false,
          zeroline:false,
          tickformat:".2%",
          rangemode:"tozero",
          fixedrange:false
        },

        annotations:frequencyAnnotations,

        shapes:[
          {
            type:"rect",
            x0:result.predictedYear - 0.5,
            x1:result.predictedYear + 0.5,
            y0:0,
            y1:1,
            xref:"x",
            yref:"paper",
            fillcolor:"rgba(31,119,180,0.08)",
            line:{width:0},
            layer:"below"
          },
          {
            type:"line",
            x0:result.predictedYear,
            x1:result.predictedYear,
            y0:0,
            y1:1,
            xref:"x",
            yref:"paper",
            line:{
              color:MODEL_COLOR,
              width:3,
              dash:"dash"
            },
            layer:"above"
          }
        ],

        updatemenus:[
          {
            type:"dropdown",
            direction:"down",
            x:1.0,
            y:1.16,
            xanchor:"right",
            yanchor:"top",
            showactive:true,
            buttons:[
              {
                label:"Frequency",
                method:"update",
                args:[
                  {visible:visibleFrequency},
                  {
                    "yaxis.title.text":"Smoothed frequency",
                    "yaxis.tickformat":",",
                    "yaxis.autorange":true,
                    annotations:frequencyAnnotations
                  }
                ]
              },
              {
                label:"Percentage",
                method:"update",
                args:[
                  {visible:visiblePercentage},
                  {
                    "yaxis.title.text":"Share of all births",
                    "yaxis.tickformat":".3%",
                    "yaxis.autorange":true,
                    annotations:percentageAnnotations
                  }
                ]
              }
            ]
          }
        ]
      };

      const config = {
        scrollZoom:false,
        displayModeBar:true,
        displaylogo:false,
        doubleClick:false,
        responsive:false,
        toImageButtonOptions:{
          format:"png",
          filename:"yearbook_guesser",
          scale:3
        }
      };

      await Plotly.react(
        plotEl,
        traces,
        layout,
        config
      );
    }

    async function guess(){
      const token = ++loadToken;
      const names = parseNames(namesInput.value);

      if(!names.length){
        currentResult = null;
        Plotly.purge(plotEl);
        predictionEl.hidden = true;
        setStatus("Enter at least one first name.", true);
        return;
      }

      guessButton.disabled = true;
      predictionEl.hidden = true;
      if(isCustom) statusEl.hidden = false;
      setStatus(
        `Loading ${new Set(names.map(cleanKey)).size} unique name packet` +
        `${new Set(names.map(cleanKey)).size === 1 ? "" : "s"}…`
      );

      try{
        if(!manifest || !yearbookTotals){
          await configureLatestData();
        }

        const result = await computeYearbook(names);

        if(token !== loadToken) return;

        currentResult = result;

        predictionYearEl.textContent = String(
          result.predictedYear
        );
        predictionEl.hidden = false;

        await renderPlot(result);

        if(token !== loadToken) return;

        if(!isCustom){
          statusEl.hidden = true;
        }

        const latestYear = result.years[result.years.length-1];

        if(result.missing.length){
          setStatus(
            `Prediction uses data through ${latestYear}. ` +
            `No national SSA rows were found for: ${result.missing.join(", ")}; ` +
            `those entries use the model's floor value only.`
          );
        }else{
          setStatus(
            `Prediction uses ${names.length} name entr` +
            `${names.length === 1 ? "y" : "ies"} and national data through ${latestYear}.`
          );
        }

      }catch(error){
        if(token !== loadToken) return;

        console.error(error);
        currentResult = null;
        Plotly.purge(plotEl);
        predictionEl.hidden = true;
        statusEl.hidden = false;

        setStatus(
          error?.message || String(error),
          true
        );
      }finally{
        if(token === loadToken){
          guessButton.disabled = false;
        }
      }
    }

    guessButton.addEventListener("click", guess);

    namesInput.addEventListener("keydown", event => {
      if((event.ctrlKey || event.metaKey) && event.key === "Enter"){
        event.preventDefault();
        guess();
      }
    });


    const params = new URLSearchParams(
      window.location.search
    );

    const presetKey = PRESETS[params.get("preset")]
      ? params.get("preset")
      : "mambo";

    const preset = PRESETS[presetKey];
    const isCustom = presetKey === "custom";

    customControls.hidden = !isCustom;
    customHint.hidden = !isCustom;
    presetPanel.hidden = isCustom;

    if(preset.names.length){
      namesInput.value = preset.names.join(", ");
      presetNamesEl.textContent = preset.names.join(", ");
      statusEl.hidden = true;
    }else{
      statusEl.hidden = false;
    }

    try{
      const loaderModule = await import(
        "../../assets/js/name-data-loader.js"
      );
      NameData = loaderModule.default;

      if(!NameData){
        throw new Error("Shared name-data loader did not initialize.");
      }

      await configureLatestData();

      if(preset.names.length){
        await guess();
      }else{
        setStatus(
          "Enter a list of first names, then choose Guess Birth Year."
        );
      }
    }catch(error){
      console.error(error);
      statusEl.hidden = false;
      setStatus(
        "Unable to initialize the current data version. " +
        (error?.message || String(error)),
        true
      );
    }
  </script>
</body>
</html>
