        // zoom levels or widths.
        const mapWidth = Math.max(600, mapDiv.clientWidth || root.clientWidth || 1000);
        const mapHeight = Math.max(320, mapDiv.clientHeight || 417);
        const plotAspect = mapWidth / mapHeight;
        const usaAspect = 1.58;
        const desiredMapHeight = Math.min(
          rowSlot - labelReserve,
          Math.max(0.20, w * plotAspect / usaAspect)
        );

        const y1 = rowTop - labelReserve;
        const y0 = Math.max(rowBottom, y1 - desiredMapHeight);

        return {
          x: [x0, x1],
          y: [y0, y1],
          labelY: Math.min(0.985, y1 + 0.010)
        };
      }

      function buildSmallMultipleMapTraces(round, indices) {
        const traces = [];
        const annotations = [];
        const periodIndex = state.periodIndex;

        indices.forEach((idx, i) => {
          const locations = DISPLAY_STATES.slice();
          const z = [];
          const hoverText = [];

          let maxPct = 0;

          DISPLAY_STATES.forEach(st => {
            const count = stateCountByCode(idx, "combined", periodIndex, st);
            const denom = stateDenomByCode("combined", periodIndex, st);
            const pct = denom > 0 ? count / denom : 0;

            maxPct = Math.max(maxPct, pct);
            z.push(pct);

            hoverText.push(
              `<b>${st}</b><br>` +
              `Period: ${periodLabel()}<br>` +
              `${round.answered ? getName(idx) : `Name ${i + 1}`}<br>` +
              `Births: ${comma(count)}<br>` +
              `All births: ${comma(denom)}<br>` +
              `<b>Share of Births:</b> ${(100 * pct).toFixed(3)}%`
            );
          });

          const geoName = i === 0 ? "geo" : `geo${i + 1}`;

          traces.push(singleChoroplethTrace(
            locations,
            z,
            monoColorscale(getMultiLineColor(i)),
            hoverText,
            {
              zmin: 0,
              zmax: Math.max(maxPct, 1e-12),
              geo: geoName
            }
          ));

          const domain = smallMultipleDomain(i, indices.length);
          annotations.push({
            text: `<b>${round.answered ? getName(idx) : `Name ${i + 1}`}</b>`,
            x: (domain.x[0] + domain.x[1]) / 2,
            y: domain.labelY,
            xref: "paper",
            yref: "paper",
            showarrow: false,
            xanchor: "center",
            yanchor: "top",
            font: {size: 18, color: getMultiLineColor(i)}
          });
        });

        return {traces, annotations};
      }

      function baseGeo(domain) {
        return {
          scope: "usa",
          projection: {type: "albers usa"},
          domain: domain,
          showlakes: false,
          showland: true,
          landcolor: "#ffffff",
          bgcolor: "rgba(0,0,0,0)"
        };
      }

      function baseMapLayout(title, keyType, annotations, shapes=[]) {
        const layout = {
          title: {
            text: `${title}<br><sup>${periodLabel()}</sup>`,
            x: 0.5,
            xanchor: "center",
            font: {size: 21}
          },
          margin: {l: 10, r: 10, t: 58, b: 4},
          paper_bgcolor: "white",
          plot_bgcolor: "white",
          geo: baseGeo(
            keyType
              ? {x: [0.00, 0.72], y: [0.00, 1.00]}
              : {x: [0.00, 1.00], y: [0.00, 1.00]}
          ),
          xaxis: {
            domain: [0.755, 0.985],
            showgrid: false,
            zeroline: false,
            showticklabels: false,
            fixedrange: true
          },
          yaxis: {
            domain: keyType === "binary" ? [0.13, 0.88] : [0.18, 0.82],
            showgrid: false,
            zeroline: false,
            showticklabels: false,
            fixedrange: true
          },
          annotations: annotations || [],
          shapes: shapes || [],
          showlegend: false,
          hoverlabel: {
            bgcolor: "white",
            bordercolor: "rgba(0,0,0,0.25)",
            font: {family: "Arial", size: 17, color: "#222"}
          },
          transition: {
            duration: 350,
            easing: "cubic-in-out"
          },
          uirevision: "name_curve_game_map"
        };

        if (keyType === "binary") {
          layout.xaxis.range = [-0.18, 0.18];
          layout.yaxis.range = [-0.075, 1.075];
        }

        if (keyType === "ternary") {
          layout.xaxis.range = [-0.065, 1.065];
          layout.yaxis.range = [-0.115, Math.sqrt(3) / 2 + 0.115];
          layout.yaxis.scaleanchor = "x";
          layout.yaxis.scaleratio = 1;
        }

        return layout;
      }

      function plotMapWithKind(kind, traces, layout) {
        if (state.mapKind !== kind) {
          try {
            Plotly.purge(mapDiv);
          } catch (e) {
            // Safe no-op if Plotly has not initialized this div yet.
          }
          state.mapKind = kind;
        }

        const config = {
          responsive: true,
          displayModeBar: false,
          scrollZoom: false
        };

        Plotly.react(mapDiv, traces, layout, config).then(() => {
          window.requestAnimationFrame(() => {
            if (isMapView(state.view)) {
              Plotly.Plots.resize(mapDiv);
            }
          });
        });
      }

      function drawMap() {
        const round = currentRound();

        if (!round) {
          plotMapWithKind("empty", [], {});
          return;
        }

        const indices = selectedIndicesForRound(round);

        if (round.type === "single" || state.view === "percentage") {
          const trace = buildSingleMapTrace(round);
          const layout = baseMapLayout("State map of name percentage", null, []);
          plotMapWithKind("single_percentage", [trace], layout);
          return;
        }

        if (state.view === "split") {
          const small = buildSmallMultipleMapTraces(round, indices);
          const layout = {
            title: {
              text: `Split state percentage maps<br><sup>${periodLabel()}</sup>`,
              x: 0.5,
              xanchor: "center",
              font: {size: 19}
            },
            margin: {l: 8, r: 8, t: 42, b: 0},
            paper_bgcolor: "white",
            plot_bgcolor: "white",
            annotations: small.annotations,
            showlegend: false,
            hoverlabel: {
              bgcolor: "white",
              bordercolor: "rgba(0,0,0,0.25)",
              font: {family: "Arial", size: 17, color: "#222"}
            },
            transition: {
              duration: 350,
              easing: "cubic-in-out"
            },
            uirevision: "name_curve_game_small_multiples"
          };

          indices.forEach((idx, i) => {
            const geoName = i === 0 ? "geo" : `geo${i + 1}`;
            const domain = smallMultipleDomain(i, indices.length);

            layout[geoName] = baseGeo({x: domain.x, y: domain.y});
          });

          plotMapWithKind(`split_${indices.length}`, small.traces, layout);
          return;
        }

        if (indices.length === 2) {
          const colors = [getMultiColor(0), getMultiColor(1)];
          const traces = buildBinaryBalanceTraces(round, indices, colors);
          const layout = baseMapLayout(
            "State balance map of selected names",
            "binary",
            binaryAnnotations(round, indices),
            binaryGradientShapes(colors).concat(binaryShapes())
          );

          plotMapWithKind("binary_balance", traces, layout);
          return;
        }

        if (indices.length === 3) {
          const traces = buildTernaryBalanceTraces(round, indices, BALANCE_TRI_COLORS);
          const layout = baseMapLayout(
            "Centered state balance map of selected names",
            "ternary",
            triangleAnnotations(round, indices)
          );

          plotMapWithKind("ternary_balance", traces, layout);
          return;
        }

        const small = buildSmallMultipleMapTraces(round, indices);
        const layout = {
          title: {
            text: `Split state percentage maps<br><sup>${periodLabel()}</sup>`,
            x: 0.5,
            xanchor: "center",
            font: {size: 21}
          },
          margin: {l: 8, r: 8, t: 54, b: 0},
          paper_bgcolor: "white",
          plot_bgcolor: "white",
          annotations: small.annotations,
          showlegend: false,
          hoverlabel: {
            bgcolor: "white",
            bordercolor: "rgba(0,0,0,0.25)",
            font: {family: "Arial", size: 17, color: "#222"}
          },
          transition: {
            duration: 350,
            easing: "cubic-in-out"
          },
          uirevision: "name_curve_game_small_multiples"
        };

        indices.forEach((idx, i) => {
          const geoName = i === 0 ? "geo" : `geo${i + 1}`;
          const domain = smallMultipleDomain(i, indices.length);

          layout[geoName] = baseGeo({x: domain.x, y: domain.y});
        });

        plotMapWithKind(`split_${indices.length}`, small.traces, layout);
      }

      function showFeedback(kind, html) {
        feedback.className = "ncg-feedback visible " + kind;
        feedback.innerHTML = html;
      }

      function clearFeedback() {
        feedback.className = "ncg-feedback";
        feedback.innerHTML = "";
      }

      function renderRoundStatus() {
        const round = currentRound();

        if (state.mode === "custom") {
          roundStatus.innerHTML = "<strong>Custom challenge</strong>";
          return;
        }

        if (!round) {
          roundStatus.innerHTML = "<strong>No active game</strong>";
          return;
        }

        const diffLabel = PAYLOAD.difficultyLabels[String(round.level)] || "";
        const descriptor = round.theme
          ? `${escapeHtml(diffLabel)}: ${escapeHtml(round.theme)}`
          : `Difficulty ${round.level}/5: ${escapeHtml(diffLabel)}`;

        roundStatus.innerHTML =
          `<strong>Round ${state.roundIndex + 1} of ${state.rounds.length}</strong>` +
          ` <span class="ncg-note">${descriptor}</span>`;
      }

      function renderSingleChoice(round) {
        const title = document.createElement("div");
        title.className = "ncg-answer-title";
        title.textContent = round.answered
          ? "Answer revealed. Other choice curves are shown for comparison."
          : "Which name matches the curve?";

        answerArea.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "ncg-choice-grid";

        round.choices.forEach(idx => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ncg-choice";
          btn.textContent = getName(idx);

          if (round.answered) {
            btn.disabled = true;

            if (idx === round.answer) {
              btn.classList.add("correct");
            } else if (idx === round.selected) {
              btn.classList.add("incorrect");
            }
          }

          btn.addEventListener("click", () => {
            if (round.answered) return;

            const shouldAnimateReveal = viewSelect.value === "line";
            const beforeRange = shouldAnimateReveal
              ? computeYRange(getSeriesForRound(round))
              : null;

            round.selected = idx;
            round.answered = true;
            state.hover = null;

            if (shouldAnimateReveal) {
              const afterRange = computeYRange(getSeriesForRound(round));
              beginSingleRevealAxisAnimation(beforeRange, afterRange);
            } else {
              cancelAxisAnimation();
            }

            render();
          });

          grid.appendChild(btn);
        });

        answerArea.appendChild(grid);

        if (round.answered) {
          const correct = round.selected === round.answer;
          const md = getMetadata(round.answer);

          if (correct) {
            showFeedback(
              "correct",
              `<b>Correct.</b> The curve is ${getName(round.answer)}. ` +
              `Peak year: ${md.peakYear}. Peak frequency: ${Number(md.peakFrequency || 0).toLocaleString()}.`
            );
          } else {
            showFeedback(
              "incorrect",
              `<b>Not quite.</b> You chose ${getName(round.selected)}, but the curve is ${getName(round.answer)}. ` +
              `Peak year: ${md.peakYear}. Peak frequency: ${Number(md.peakFrequency || 0).toLocaleString()}.`
            );
          }

          renderNavigationButtons();
        }
      }

      function renderMatchRound(round) {
        const title = document.createElement("div");
        title.className = "ncg-answer-title";
        title.textContent = round.answered
          ? "Answers revealed."
          : "Match each numbered curve to its name.";

        answerArea.appendChild(title);

        const header = document.createElement("div");
        header.className = "ncg-match-header";

        const nameList = document.createElement("div");
        nameList.className = "ncg-name-list";
        nameList.innerHTML = `<b>Names:</b> ${round.nameChoices.map(getName).join(", ")}`;
        header.appendChild(nameList);

        if (!round.answered) {
          const submit = document.createElement("button");
          submit.type = "button";
          submit.className = "ncg-submit-inline";
          submit.textContent = "Submit";

          submit.addEventListener("click", () => {
            const allAnswered = round.curveOrder.every((_, pos) =>
              round.assignments[String(pos)] !== undefined
            );

            if (!allAnswered) {
              showFeedback("neutral", "Choose a name for each curve before submitting.");
              return;
            }

            round.answered = true;
            render();
          });

          header.appendChild(submit);
        } else {
          renderNavigationButtons(header);
        }

        answerArea.appendChild(header);

        if (isMapView(state.view) && round.curveOrder.length >= 4) {
          const note = document.createElement("div");
          note.className = "ncg-note";
          note.style.margin = "0 0 7px 0";
          note.innerHTML = "Balance maps are available for 3 or fewer names. Split map shows one percentage map per name.";
          answerArea.appendChild(note);
        }

        const grid = document.createElement("div");
        grid.className = "ncg-match-grid";

        round.curveOrder.forEach((idx, pos) => {
          const card = document.createElement("div");
          card.className = "ncg-match-card";

          const label = document.createElement("div");
          label.className = "ncg-match-label";

          const swatch = document.createElement("span");
          swatch.className = "ncg-swatch";
          swatch.style.background = getMultiLineColor(pos);

          const labelText = document.createElement("span");
          labelText.textContent = `Name ${pos + 1}`;

          label.appendChild(swatch);
          label.appendChild(labelText);

          const select = document.createElement("select");
          select.disabled = round.answered;

          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "Choose name...";
          select.appendChild(placeholder);

          round.nameChoices.forEach(nameIdx => {
            const opt = document.createElement("option");
            opt.value = String(nameIdx);
            opt.textContent = getName(nameIdx);
            select.appendChild(opt);
          });

          if (round.assignments[String(pos)] !== undefined) {
            select.value = String(round.assignments[String(pos)]);
          }

          select.addEventListener("change", () => {
            if (select.value === "") {
              delete round.assignments[String(pos)];
            } else {
              round.assignments[String(pos)] = Number(select.value);
            }
          });

          card.appendChild(label);
          card.appendChild(select);

          if (round.answered) {
            const chosen = round.assignments[String(pos)];
            const correct = chosen === idx;

            const checkline = document.createElement("div");
            checkline.className = "ncg-checkline";

            if (correct) {
              checkline.innerHTML = `✓ Correct: <b>${getName(idx)}</b>`;
              checkline.style.color = "#2E8B57";
            } else {
              const chosenText = chosen === undefined ? "nothing" : getName(chosen);
              checkline.innerHTML = `✗ You chose ${chosenText}. Correct: <b>${getName(idx)}</b>`;
              checkline.style.color = "#D62728";
            }

            card.appendChild(checkline);
          }

          grid.appendChild(card);
        });

        answerArea.appendChild(grid);

        if (round.answered) {
          const score = round.curveOrder.reduce((acc, idx, pos) => {
            return acc + (round.assignments[String(pos)] === idx ? 1 : 0);
          }, 0);

          const total = round.curveOrder.length;

          showFeedback(
            score === total ? "correct" : "incorrect",
            `<b>Score: ${score}/${total}.</b> The curves are now labeled with their names.`
          );
        }
      }

      async function nextRound() {
        if (state.roundIndex < state.rounds.length - 1) {
          state.roundIndex += 1;
          resetInspectionDefaults();
          roundStatus.innerHTML = "<strong>Loading round…</strong>";

          try {
            await ensureRoundNational(currentRound());
            render();
          } catch (error) {
            console.error(error);
            showFeedback("neutral", escapeHtml(error?.message || String(error)));
          }
        }
      }

      function renderNavigationButtons(parentEl=answerArea) {
        const nav = document.createElement("div");
        nav.className = "ncg-nav-row";

        if (state.mode !== "custom" && state.roundIndex < state.rounds.length - 1) {
          const next = document.createElement("button");
          next.type = "button";
          next.textContent = "Next";
          next.addEventListener("click", nextRound);
          nav.appendChild(next);
        }

        if (state.mode !== "custom" && state.roundIndex === state.rounds.length - 1) {
          const restart = document.createElement("button");
          restart.type = "button";
          restart.textContent = "New";
          restart.addEventListener("click", startNewGame);
          nav.appendChild(restart);
        }

        if (state.mode === "custom") {
          const retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "Reset";
          retry.addEventListener("click", () => {
            const round = currentRound();
            if (!round) return;
            round.answered = false;
            round.assignments = {};
            resetInspectionDefaults();
            render();
          });
          nav.appendChild(retry);
        }

        parentEl.appendChild(nav);
      }

      function renderAnswerArea() {
        const round = currentRound();

        answerArea.innerHTML = "";
        clearFeedback();

        if (!round) {
          const note = document.createElement("div");
          note.className = "ncg-note";

          if (state.mode === "custom") {
            note.textContent = "Enter 2–6 names above to start a custom matching challenge.";
          } else {
            note.textContent = "Click New to begin.";
          }

          answerArea.appendChild(note);
          return;
        }

        if (round.type === "single") {
          renderSingleChoice(round);
        } else {
          renderMatchRound(round);
        }
      }

      function renderVisualization() {
        syncInspectionControlsForView();

        state.view = viewSelect.value;
        state.sex = sexSelect.value;
        state.metric = metricSelect.value;
        state.scale = scaleSelect.value;
        state.periodIndex = Number(periodSlider.value || 0);

        periodLabelEl.textContent = periodText(state.periodIndex);

        const mapVisible = isMapView(state.view);

        canvas.style.display = mapVisible ? "none" : "block";
        mapDiv.style.display = mapVisible ? "block" : "none";
        mapSliderBox.style.display = mapVisible ? "block" : "none";

        if (mapVisible) {
          window.requestAnimationFrame(() => {
            drawMap();
          });
        } else {
          drawLinePlot();
        }
      }

      function render() {
        state.mode = modeSelect.value;
        customBox.classList.toggle("visible", state.mode === "custom");

        syncViewOptionsForRound();
        renderRoundStatus();
        renderVisualization();
        renderAnswerArea();
      }

      function makeSingleRoundFromEntry(base) {
        return {
          type: "single",
          level: Number(base.level),
          answer: Number(base.answer),
          choices: shuffle(base.choices.slice()),
          theme: base.theme || null,
          themeCategory: base.themeCategory || null,
          themeSourceLine: base.themeSourceLine || null,
          selected: null,
          answered: false
        };
      }

      function makeMultiRoundFromEntry(base) {
        const names = base.names.slice();

        return {
          type: "multi",
          level: Number(base.level),
          indices: names.slice(),
          curveOrder: shuffle(names.slice()),
          nameChoices: shuffle(names.slice()),
          theme: base.theme || null,
          themeCategory: base.themeCategory || null,
          themeSourceLine: base.themeSourceLine || null,
          assignments: {},
          answered: false
        };
      }

      function makeGameFromBank(mode) {
        const bank = PAYLOAD.roundBanks[mode];

        if (!Array.isArray(bank) || bank.length === 0) {
          throw new Error(`No ${mode} no-repeat game sequences found in PAYLOAD.roundBanks.`);
        }

        const sequence = randomChoice(bank);

        if (!Array.isArray(sequence) || sequence.length === 0) {
          throw new Error(`Invalid ${mode} game sequence in PAYLOAD.roundBanks.`);
        }

        if (mode === "single") {
          return sequence.map(makeSingleRoundFromEntry);
        }

        return sequence.map(makeMultiRoundFromEntry);
      }

      async function startNewGame() {
        state.mode = modeSelect.value;
        state.roundIndex = 0;

        resetInspectionDefaults();

        if (state.mode === "custom") {
          state.rounds = [];
          render();
          return;
        }

        state.rounds = makeGameFromBank(state.mode);
        roundStatus.innerHTML = "<strong>Loading round…</strong>";
        answerArea.innerHTML = '<div class="ncg-note">Loading name data…</div>';
        clearFeedback();

        try {
          await ensureRoundNational(currentRound());
          render();
        } catch (error) {
          console.error(error);
          state.rounds = [];
          render();
          showFeedback("neutral", escapeHtml(error?.message || String(error)));
        }
      }

      async function startCustomRound() {
        const rawNames = customNamesInput.value
          .split(/[,;\n]/)
          .map(s => s.trim())
          .filter(Boolean);

        const cleaned = [];
        const displayRaw = [];

        rawNames.forEach(raw => {
          const c = cleanNameInput(raw);
          if (!cleaned.includes(c)) {
            cleaned.push(c);
            displayRaw.push(raw);
          }
        });

        if (cleaned.length < 2 || cleaned.length > 6) {
          state.rounds = [];
          render();
          showFeedback("neutral", "Enter between 2 and 6 distinct names.");
          return;
        }

        startCustomButton.disabled = true;
        roundStatus.innerHTML = "<strong>Loading custom challenge…</strong>";
        clearFeedback();

        try {
          const resolved = await Promise.all(
            displayRaw.map(async raw => ({
              raw,
              idx: await resolveCustomName(raw)
            }))
          );

          const missing = resolved
            .filter(item => item.idx === null)
            .map(item => item.raw);

          if (missing.length) {
            state.rounds = [];
            render();
            showFeedback(
              "neutral",
              `No national baby-name packet was found for: <b>${missing.map(escapeHtml).join(", ")}</b>.`
            );
            return;
          }

          const indices = resolved.map(item => item.idx);

          state.mode = "custom";
          modeSelect.value = "custom";
          state.roundIndex = 0;
          resetInspectionDefaults();

          state.rounds = [{
            type: "custom",
            level: null,
            indices: indices.slice(),
            curveOrder: shuffle(indices.slice()),
            nameChoices: shuffle(indices.slice()),
            assignments: {},
            answered: false
          }];

          render();
        } catch (error) {
          console.error(error);
          state.rounds = [];
          render();
          showFeedback("neutral", escapeHtml(error?.message || String(error)));
        } finally {
          startCustomButton.disabled = false;
        }
      }

      modeSelect.addEventListener("change", startNewGame);

      viewSelect.addEventListener("change", async () => {
        state.hover = null;
        cancelAxisAnimation();

        if (isMapView(viewSelect.value)) {
          viewSelect.disabled = true;
          try {
            await ensureRoundState(currentRound());
          } catch (error) {
            console.error(error);
            showFeedback("neutral", escapeHtml(error?.message || String(error)));
            viewSelect.value = "line";
          } finally {
            viewSelect.disabled = false;
          }
        }

        render();
      });

      sexSelect.addEventListener("change", () => {
        state.hover = null;
        cancelAxisAnimation();
        saveFreeSettingsFromControls();
        render();
      });

      metricSelect.addEventListener("change", () => {
        state.hover = null;
        cancelAxisAnimation();

        if (!isMapView(viewSelect.value)) {
          const previousMetric = state.freeSettings.metric;
          const nextMetric = metricSelect.value;

          if (previousMetric !== "rank" && scaleSelect.value !== "log") {
            state.lastNonRankScale = scaleSelect.value;
          }

          state.freeSettings.metric = nextMetric;

          if (nextMetric === "rank") {
            state.freeSettings.scale = "log";
            scaleSelect.value = "log";
          } else {
            if (previousMetric === "rank") {
              scaleSelect.value = state.lastNonRankScale || "linear";
            }
            state.freeSettings.scale = scaleSelect.value;
          }
        }

        render();
      });

      scaleSelect.addEventListener("change", () => {
        state.hover = null;
        cancelAxisAnimation();

        if (!isMapView(viewSelect.value)) {
          if (metricSelect.value === "rank") {
            state.freeSettings.metric = "rank";
            state.freeSettings.scale = "log";
            scaleSelect.value = "log";
          } else {
            state.freeSettings.scale = scaleSelect.value;
            state.lastNonRankScale = scaleSelect.value;
          }
        }

        render();
      });

      periodSlider.addEventListener("input", render);

      newGameButton.addEventListener("click", startNewGame);
      startCustomButton.addEventListener("click", startCustomRound);

      canvas.addEventListener("mousemove", evt => {
        if (state.view !== "line") return;

        const round = currentRound();
        const series = getSeriesForRound(round);
        const box = plotBox();
        const range = displayRangeForSeries(series);
        const pos = pointerPosition(evt);

        state.hover = findNearestPoint(series, box, range, pos);
        drawLinePlot();
      });

      canvas.addEventListener("mouseleave", () => {
        state.hover = null;
        drawLinePlot();
      });

      let redrawQueued = false;

      function redrawForContainerChange() {
        if (redrawQueued) return;
        redrawQueued = true;

        window.requestAnimationFrame(() => {
          redrawQueued = false;

          if (isMapView(state.view)) {
            if (mapDiv._fullLayout) Plotly.Plots.resize(mapDiv);
            drawMap();
          } else {
            drawLinePlot();
          }
        });
      }

      window.addEventListener("resize", redrawForContainerChange);

      if (window.ResizeObserver) {
        const plotWrap = root.querySelector(".ncg-plot-wrap");
        const ro = new ResizeObserver(redrawForContainerChange);
        ro.observe(plotWrap);
      }

      setSexOptionsForCurrentMode();
      await startNewGame();
    })();
  </script>
</div>

</body>
</html>
