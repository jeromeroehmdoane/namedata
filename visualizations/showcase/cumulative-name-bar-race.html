        id="race-svg"
        viewBox="0 0 ${SETTINGS.width} ${SETTINGS.height}"
        width="100%"
        style="display:block; background:${SETTINGS.backgroundColor};"
        role="img"
        aria-label="Animated bar chart race of cumulative most popular baby names"
      ></svg>

      <div style="
        display:flex;
        align-items:center;
        gap:10px;
        margin-top:6px;
        width:100%;
        font-size:15px;
      ">
        <button id="play-btn" type="button" style="
          border:1px solid rgba(0,0,0,0.24);
          background:white;
          border-radius:8px;
          padding:7px 12px;
          cursor:pointer;
          font-size:15px;
        ">▶ Play</button>

        <button id="prev-year-btn" type="button" style="
          border:1px solid rgba(0,0,0,0.24);
          background:white;
          border-radius:8px;
          padding:7px 12px;
          cursor:pointer;
          font-size:15px;
        ">◀ Year</button>

        <button id="next-year-btn" type="button" style="
          border:1px solid rgba(0,0,0,0.24);
          background:white;
          border-radius:8px;
          padding:7px 12px;
          cursor:pointer;
          font-size:15px;
        ">Year ▶</button>

        <input
          id="year-slider"
          type="range"
          min="0"
          max="${nFrames - 1}"
          step="0.001"
          value="0"
          style="flex:1;"
          aria-label="Year slider"
        />
      </div>
    </div>
  `;

  const svg = document.getElementById("race-svg");
  const playBtn = document.getElementById("play-btn");
  const prevYearBtn = document.getElementById("prev-year-btn");
  const nextYearBtn = document.getElementById("next-year-btn");
  const slider = document.getElementById("year-slider");

  // Definitions and clipping
  const defs = el("defs", {}, svg);

  const clip = el("clipPath", { id: "plot-clip" }, defs);

  el("rect", {
    x: layout.plotLeft,
    y: layout.plotTop - layout.rowHeight * 0.12,
    width: layout.plotWidth + layout.plotRight,
    height: layout.plotHeight + layout.rowHeight * 0.24
  }, clip);

  // Base groups
  const titleGroup = el("g", { id: "title" }, svg);
  const gridGroup = el("g", { id: "grid" }, svg);
  const axisGroup = el("g", { id: "axis" }, svg);
  const barGroup = el("g", { id: "bars", "clip-path": "url(#plot-clip)" }, svg);
  const yearGroup = el("g", { id: "year-label" }, svg);

  // Title, close to the plot.
  el("text", {
    x: layout.plotLeft,
    y: 42,
    "text-anchor": "start",
    "font-size": 31,
    "font-weight": 700,
    fill: SETTINGS.textColor
  }, titleGroup).textContent = SETTINGS.title;

  // Static axis title
  el("text", {
    x: layout.plotLeft + layout.plotWidth / 2,
    y: SETTINGS.height - 58,
    "text-anchor": "middle",
    "font-size": 17,
    fill: SETTINGS.textColor
  }, svg).textContent = "Cumulative births";

  // Year watermark
  const yearText = el("text", {
    x: SETTINGS.width - 80,
    y: SETTINGS.height - 163,
    "text-anchor": "end",
    "font-size": 82,
    "font-weight": 700,
    fill: SETTINGS.yearColor
  }, yearGroup);

  // One reusable SVG group per tracked name
  const rowNodes = names.map((name) => {
    const g = el("g", { class: "name-row" }, barGroup);

    const rect = el("rect", {
      x: layout.plotLeft,
      y: -layout.barHeight / 2,
      height: layout.barHeight,
      rx: 5,
      ry: 5
    }, g);

    const nameText = el("text", {
      y: 6,
      "text-anchor": "end",
      "font-size": 21,
      "font-weight": 700,
      fill: "white"
    }, g);

    const valueText = el("text", {
      y: 6,
      "text-anchor": "start",
      "font-size": 17,
      "font-weight": 500,
      fill: SETTINGS.mutedTextColor
    }, g);

    return { g, rect, nameText, valueText };
  });

  function render() {
    const state = getInterpolatedState(timeIndex);

    drawAxis(state.xmax);

    yearText.textContent = String(Math.round(state.year));
    slider.value = String(timeIndex);

    state.rows.forEach((row) => {
      const node = rowNodes[row.idx];

      const y = yScale(row.rankPos);
      const width = Math.max(0, xScale(row.value, state.xmax) - layout.plotLeft);
      const barEnd = layout.plotLeft + width;

      const isVisible = row.rankPos <= topN + 0.55 && row.value > 0;
      const opacity = isVisible ? 1 : 0;

      // Reorder nodes each frame so moving rows overlap naturally.
      barGroup.appendChild(node.g);

      setAttributes(node.g, {
        transform: `translate(0, ${y})`,
        opacity: opacity
      });

      setAttributes(node.rect, {
        width: width,
        fill: row.sex === "F" ? SETTINGS.femaleColor : SETTINGS.maleColor
      });

      // Name labels: inside the bar, right side, right-justified.
      node.nameText.textContent = isVisible && width >= 95 ? row.name : "";

      setAttributes(node.nameText, {
        x: Math.max(layout.plotLeft + 8, barEnd - 12)
      });

      // Numeric labels: outside the bar.
      node.valueText.textContent = isVisible ? commaCount(row.value) : "";

      setAttributes(node.valueText, {
        x: barEnd + 10
      });
    });
  }

  function animate(timestamp) {
    if (!isPlaying) {
      lastTimestamp = timestamp;
      rafId = requestAnimationFrame(animate);
      return;
    }

    if (lastTimestamp === null) {
      lastTimestamp = timestamp;
    }

    const delta = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    timeIndex += delta / SETTINGS.yearDuration;

    if (timeIndex >= nFrames - 1) {
      timeIndex = nFrames - 1;
      isPlaying = false;
      playBtn.textContent = "▶ Play";
    }

    render();
    rafId = requestAnimationFrame(animate);
  }

  function setPlaying(value) {
    isPlaying = value;
    playBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Play";
    lastTimestamp = null;
  }

  function jumpToNearestYear(direction) {
    const current = Math.round(timeIndex);
    const next = clamp(current + direction, 0, nFrames - 1);

    timeIndex = next;
    setPlaying(false);
    render();
  }

  playBtn.addEventListener("click", () => {
    if (timeIndex >= nFrames - 1) {
      timeIndex = 0;
    }

    setPlaying(!isPlaying);
    render();
  });

  prevYearBtn.addEventListener("click", () => jumpToNearestYear(-1));
  nextYearBtn.addEventListener("click", () => jumpToNearestYear(1));

  slider.addEventListener("input", () => {
    timeIndex = Number(slider.value);
    setPlaying(false);
    render();
  });

  render();
  rafId = requestAnimationFrame(animate);
})();
</script>
</body>
</html>
