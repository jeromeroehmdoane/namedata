const STATES = ["AK","AL","AR","AZ","CA","CO","CT","DC","DE","FL","GA","HI","IA","ID","IL","IN","KS","KY","LA","MA","MD","ME","MI","MN","MO","MS","MT","NC","ND","NE","NH","NJ","NM","NV","NY","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VA","VT","WA","WI","WV","WY"];

const DEFAULT_DISTANCE_MODE = "centroid";
const DEFAULT_HIGHLIGHT_STATE = "";

const BASE_POINT_COLOR = "rgba(94,60,153,0.42)";
const HIGHLIGHT_COLOR = "#5E3C99";

const BASE_MARKER_SIZE = 7;
const BASE_MARKER_OPACITY = 0.6;
const HIGHLIGHT_MARKER_SIZE = 11;
const HIGHLIGHT_MARKER_OPACITY = 0.95;
const HIGHLIGHT_LABEL_SIZE = 10;

const distanceSelect = document.getElementById("distanceMode");
const highlightInput = document.getElementById("highlightState");
const resetStateButton = document.getElementById("resetState");

distanceSelect.value = DEFAULT_DISTANCE_MODE;
highlightInput.value = DEFAULT_HIGHLIGHT_STATE;

function cleanStateInput(value) {
  return String(value || "")
    .toUpperCase()
    .replace(/[^A-Z]/g, "")
    .slice(0, 2);
}

function validHighlightedState() {
  const cleaned = cleanStateInput(highlightInput.value);
  highlightInput.value = cleaned;

  if (cleaned === "") {
    highlightInput.classList.remove("invalid");
    return "";
  }

  if (STATES.includes(cleaned)) {
    highlightInput.classList.remove("invalid");
    return cleaned;
  }

  highlightInput.classList.add("invalid");
  return "";
}

function distanceKey(mode) {
  return mode === "minimum" ? "minimumDistance" : "centroidDistance";
}

function distanceAxisTitle(mode) {
  if (mode === "minimum") {
    return "Geographic distance, minimum boundary to boundary (miles)";
  }
  return "Geographic distance, centroid to centroid (miles)";
}

function distanceHoverLabel(mode) {
  if (mode === "minimum") {
    return "Minimum distance";
  }
  return "Centroid distance";
}

function getX(d, mode) {
  return d[distanceKey(mode)];
}

function makeCustomData(rows) {
  return rows.map(d => [
    d.state1,
    d.state2,
    d.nameSimilarity,
    d.nameDistance,
    d.centroidDistance,
    d.minimumDistance
  ]);
}

function baseTrace(mode) {
  return {
    type: "scatter",
    mode: "markers",
    x: DATA.map(d => getX(d, mode)),
    y: DATA.map(d => d.nameDistance),
    customdata: makeCustomData(DATA),
    marker: {
      size: BASE_MARKER_SIZE,
      color: BASE_POINT_COLOR,
      opacity: BASE_MARKER_OPACITY,
      line: {width: 0}
    },
    hovertemplate:
      "<b>%{customdata[0]}–%{customdata[1]}</b><br>" +
      distanceHoverLabel(mode) + ": %{x:,.1f} miles<br>" +
      "Name distance: %{customdata[3]:.4f}<br>" +
      "Name similarity: %{customdata[2]:.4f}" +
      "<extra></extra>",
    showlegend: false
  };
}

function emptyHighlightTrace() {
  return {
    type: "scatter",
    mode: "markers+text",
    x: [],
    y: [],
    text: [],
    customdata: [],
    marker: {
      size: HIGHLIGHT_MARKER_SIZE,
      color: HIGHLIGHT_COLOR,
      opacity: HIGHLIGHT_MARKER_OPACITY,
      line: {width: 0.8, color: "white"}
    },
    textposition: "top center",
    textfont: {
      size: HIGHLIGHT_LABEL_SIZE,
      color: HIGHLIGHT_COLOR
    },
    hoverinfo: "skip",
    showlegend: false
  };
}

function highlightTrace(mode, selectedState) {
  if (!selectedState) {
    return emptyHighlightTrace();
  }

  const rows = DATA.filter(d => d.state1 === selectedState || d.state2 === selectedState);
  const labels = rows.map(d => d.state1 === selectedState ? d.state2 : d.state1);

  return {
    type: "scatter",
    mode: "markers+text",
    x: rows.map(d => getX(d, mode)),
    y: rows.map(d => d.nameDistance),
    text: labels,
    customdata: makeCustomData(rows),
    marker: {
      size: HIGHLIGHT_MARKER_SIZE,
      color: HIGHLIGHT_COLOR,
      opacity: HIGHLIGHT_MARKER_OPACITY,
      line: {width: 0.8, color: "white"}
    },
    textposition: "top center",
    textfont: {
      size: HIGHLIGHT_LABEL_SIZE,
      color: HIGHLIGHT_COLOR
    },
    hovertemplate:
      "<b>%{customdata[0]}–%{customdata[1]}</b><br>" +
      distanceHoverLabel(mode) + ": %{x:,.1f} miles<br>" +
      "Name distance: %{customdata[3]:.4f}<br>" +
      "Name similarity: %{customdata[2]:.4f}" +
      "<extra></extra>",
    showlegend: false
  };
}

function makeLayout(mode, selectedState) {
  const title = selectedState
    ? "<b>Geographic Distance vs. Name Distance: " + selectedState + " highlighted</b>"
    : "<b>Geographic Distance vs. Name Distance</b>";

  return {
    title: {
      text: title,
      x: 0.5,
      xanchor: "center",
      y: 0.94
    },
    width: 1100,
    height: 700,
    paper_bgcolor: "white",
    plot_bgcolor: "white",
    margin: {l: 80, r: 35, t: 90, b: 75},
    font: {size: 14},
    hovermode: "closest",
    showlegend: false,
    xaxis: {
      title: {text: distanceAxisTitle(mode)},
      showgrid: true,
      gridcolor: "rgba(0,0,0,0.10)",
      zeroline: false
    },
    yaxis: {
      title: {text: "Name distance"},
      showgrid: true,
      gridcolor: "rgba(0,0,0,0.10)",
      zeroline: false,
      rangemode: "tozero"
    }
  };
}

const config = {
  scrollZoom: false,
  displayModeBar: true,
  displaylogo: false,
  doubleClick: false,
  responsive: true,
  toImageButtonOptions: {
    format: "png",
    filename: "geo_vs_name_distance_interactive",
    scale: 3
  }
};

function renderPlot() {
  const mode = distanceSelect.value;
  const selectedState = validHighlightedState();

  const traces = [
    baseTrace(mode),
    highlightTrace(mode, selectedState)
  ];

  Plotly.react(
    "plot",
    traces,
    makeLayout(mode, selectedState),
    config
  );
}

distanceSelect.addEventListener("change", renderPlot);

highlightInput.addEventListener("input", renderPlot);

resetStateButton.addEventListener("click", () => {
  highlightInput.value = "";
  highlightInput.classList.remove("invalid");
  renderPlot();
  highlightInput.focus();
});

renderPlot();
</script>
