                y: [[0, 0, yMax * 1.08, yMax * 1.08]]
            }, [lineHighlightTraceIndex]);
        }
    }

    gd.on('plotly_hover', function(eventData) {
        if (!eventData || !eventData.points || eventData.points.length === 0) return;

        const pt = eventData.points[0];

        if (pt.curveNumber === mapTraceIndex) {
            highlightState(pt.location);
            return;
        }

        if (pt.curveNumber === keyTraceIndex) {
            if (pt.customdata && pt.customdata.length > 0) {
                highlightState(pt.customdata[0]);
            }
            return;
        }
    });

    gd.on('plotly_unhover', function(eventData) {
        clearHighlight();
    });

    gd.on('plotly_animated', function() {
        clearHighlight();

        try {
            const sliders = gd._fullLayout.sliders;
            if (sliders && sliders.length > 0) {
                const active = sliders[0].active;
                const step = sliders[0].steps[active];
                if (step && step.label !== undefined) {
                    setLineHighlightFromPeriod(step.label);
                }
            }
        } catch(e) {}
    });

    gd.on('plotly_sliderchange', function(e) {
        if (e && e.step && e.step.label !== undefined) {
            setLineHighlightFromPeriod(e.step.label);
        }
    });
})();
</script>


<script>
(function() {
  const DEFAULT_PERIOD = "Millennials";
  function applyDefaultPeriod() {
    const gd = document.querySelector(".plotly-graph-div");
    if (!gd || !gd._fullLayout || typeof Plotly === "undefined") {
      window.setTimeout(applyDefaultPeriod, 40);
      return;
    }
    Plotly.animate(
      gd,
      [DEFAULT_PERIOD],
      {
        mode: "immediate",
        frame: {duration: 0, redraw: false},
        transition: {duration: 0}
      }
    );
  }
  window.setTimeout(applyDefaultPeriod, 0);
})();
</script>
